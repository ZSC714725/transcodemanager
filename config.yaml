# TranscodeManager 配置文件示例

server:
  bind: "0.0.0.0:8080"
  # api_key: "your-secret-key"   # 非空时启用 Bearer / X-API-Key / ?api_key= 鉴权
  # cors:
  #   allowed_origins:
  #     - "http://localhost:3000"
  #     - "https://admin.example.com"
  #   allow_credentials: false     # 留空 allowed_origins 则允许所有来源（开发默认）

ffmpeg:
  path: "ffmpeg"

logging:
  level: "info"
  format: "text"

observability:
  max_log_lines: 100
  metrics_enabled: true
  metrics_path: "/metrics"
  persist_path: "data/tasks.json"   # 任务持久化，重启后恢复（不自动启动）

hooks:
  sse_enabled: true
  webhook_retries: 3
  webhook_retry_delay_seconds: 2
  webhooks: []
