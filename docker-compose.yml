services:
  transcodemanager:
    build: .
    image: transcodemanager:latest
    container_name: transcodemanager
    ports:
      - "8080:8080"
    volumes:
      - transcodemanager_data:/data
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  transcodemanager_data:
